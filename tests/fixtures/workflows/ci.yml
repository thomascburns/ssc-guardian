# A workflow inside the subset: every allowed form appears once or more.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["main", 'release/*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Run
        run: |
          echo "uses: evil/action@main"   # text, not YAML
          x=&anchor; y=*alias; [ -f a ] && echo '{a: b}'
      - name: Folded
        run: >-
          echo one
          two
      - name: Quoted
        env:
          MSG: "a \"quoted\" value: with colon"
          OTHER: 'it''s'
        run: echo "${{ matrix.python }}"
