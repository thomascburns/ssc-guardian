#
# pytest settings for the test suite. The tests import the package from src/,
# so it need not be installed.

[pytest]
testpaths = tests
pythonpath = src
addopts = --strict-markers
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
markers =
    unit: Unit tests
    integration: Integration tests
    requires_network: Test reaches the real network; skipped when the host is offline.
    doc_content: Test reads a document or another non-code file, such as README.md.
