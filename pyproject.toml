[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ssc-guardian"
version = "1.0.0"
description = "Software Supply Chain Guardian: checks Python environments and GitHub Actions against supply-chain rules."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Thomas C. Burns" }]
requires-python = ">=3.11"
# Zero runtime dependencies: the core uses only Python's standard library.
# Development tools are never listed here.
dependencies = []

[project.scripts]
ssc-guardian = "ssc_guardian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
